<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4EF">
<title>Kite — Let's set up your view</title>
<style>
  :root {
    --bg: #F3F4EF;
    --surface: #FCFCF9;
    --ink: #18231E;
    --ink-soft: #4F5B55;
    --ink-muted: #5F6A64;
    --line: #E2E5DC;
    --line-strong: #C9D1C7;
    --accent: #214B3D;
    --accent-deep: #16382D;
    --accent-soft: #E7EFE9;
    --accent-icon: #D9E7DE;
    --focus: rgba(33, 75, 61, 0.35);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    color-scheme: light;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 88% -8%, rgba(197, 220, 207, 0.55), transparent 64%),
      radial-gradient(760px 560px at -8% 108%, rgba(223, 227, 214, 0.7), transparent 62%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: #CFE0D5; color: var(--ink); }

  button { font: inherit; color: inherit; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  .shell {
    width: min(100%, 560px);
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 22px 22px 24px;
    padding: max(22px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent-deep);
  }

  .brand svg { display: block; }

  .wordmark {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1;
  }

  .step {
    margin: 0;
    color: var(--ink-muted);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.005em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .progress {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 16px;
  }

  .progress span {
    height: 3px;
    border-radius: 999px;
    background: #E0E4DB;
  }

  .progress .done { background: #A9BDB2; }
  .progress .current { background: var(--accent); }

  /* Layout */
  .layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .intro { margin-top: 42px; }

  h1 {
    margin: 0;
    max-width: 11em;
    font-size: clamp(34px, 10.2vw, 40px);
    font-weight: 600;
    line-height: 1.06;
    letter-spacing: -0.038em;
    color: var(--ink);
    text-wrap: balance;
  }

  .kite-art { display: none; }

  .panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    margin-top: 32px;
  }

  .question {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.012em;
    color: #2A352F;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 18px;
  }

  .option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 60px;
    padding: 10px 14px 10px 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    transition:
      background-color 180ms ease,
      border-color 180ms ease,
      box-shadow 180ms ease,
      transform 120ms ease;
  }

  .icon {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: #F1F3EC;
    color: #4B6357;
    transition: background-color 180ms ease, color 180ms ease;
  }

  .icon svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .option-label {
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: -0.006em;
    color: var(--ink);
    line-height: 1.25;
  }

  .check {
    flex: none;
    width: 22px;
    height: 22px;
    display: block;
  }

  .check svg { width: 22px; height: 22px; display: block; overflow: visible; }

  .check circle {
    fill: transparent;
    stroke: #B9C3B8;
    stroke-width: 1.3;
    transition: fill 160ms ease, stroke 160ms ease;
  }

  .check .tick {
    fill: none;
    stroke: #F7F8F4;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.65);
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 160ms ease, transform 220ms var(--ease);
  }

  .option.is-selected {
    background: var(--accent-soft);
    border-color: #2E5949;
    box-shadow: inset 0 0 0 1px #2E5949, 0 2px 8px rgba(33, 75, 61, 0.05);
  }

  .option.is-selected .icon {
    background: var(--accent-icon);
    color: var(--accent);
  }

  .option.is-selected .check circle {
    fill: var(--accent);
    stroke: var(--accent);
  }

  .option.is-selected .check .tick {
    opacity: 1;
    transform: scale(1);
  }

  .option:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (hover: hover) {
    .option:hover {
      background: #F9FAF5;
      border-color: var(--line-strong);
    }

    .option.is-selected:hover {
      background: #E2ECE5;
      border-color: #2E5949;
    }
  }

  .option:active { transform: scale(0.994); }

  /* Actions */
  .actions {
    margin-top: auto;
    padding-top: 28px;
  }

  .reassure {
    margin: 0 0 12px 2px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.4;
    letter-spacing: 0.002em;
  }

  .continue {
    display: block;
    width: 100%;
    min-height: 54px;
    padding: 0 24px;
    border: 0;
    border-radius: 14px;
    background: var(--accent-deep);
    color: #F7F8F4;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.004em;
    cursor: pointer;
    box-shadow:
      0 1px 2px rgba(15, 32, 25, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: background-color 160ms ease, transform 120ms ease, box-shadow 160ms ease;
  }

  .continue:hover { background: #1B4538; }

  .continue:active {
    transform: translateY(1px);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0), inset 0 1px 2px rgba(0, 0, 0, 0.12);
  }

  .continue:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .skip {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin: 2px auto 0;
    padding: 11px 12px;
    border: 0;
    background: none;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(79, 91, 85, 0.35);
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    border-radius: 8px;
    transition: color 160ms ease, text-decoration-color 160ms ease;
  }

  .skip:hover {
    color: var(--ink);
    text-decoration-color: rgba(24, 35, 30, 0.6);
  }

  .skip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Desktop composition */
  @media (min-width: 960px) {
    .shell {
      width: min(100%, 1200px);
      padding: 44px 56px 48px;
    }

    .topbar { min-height: 24px; }

    .wordmark { font-size: 18px; }

    .progress { margin-top: 18px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(400px, 0.96fr);
      align-items: center;
      gap: clamp(48px, 6vw, 88px);
      padding: 28px 0 20px;
    }

    .intro {
      margin-top: 0;
      padding-left: 4px;
      align-self: center;
    }

    h1 {
      max-width: 9.6em;
      font-size: clamp(52px, 4.55vw, 66px);
      line-height: 1.015;
      letter-spacing: -0.042em;
    }

    .kite-art {
      display: block;
      width: min(100%, 540px);
      height: auto;
      margin-top: 34px;
      overflow: visible;
    }

    .panel {
      flex: 0 1 auto;
      width: 100%;
      max-width: 472px;
      margin-top: 0;
      padding: 36px 36px 30px;
      justify-self: end;
      background: rgba(252, 252, 249, 0.82);
      border: 1px solid #E3E6DD;
      border-radius: 26px;
      box-shadow:
        0 30px 80px -34px rgba(23, 45, 35, 0.22),
        0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .question {
      font-size: 18px;
      letter-spacing: -0.014em;
    }

    .options {
      margin-top: 17px;
      gap: 9px;
    }

    .option { min-height: 62px; }

    .actions {
      margin-top: 28px;
      padding-top: 0;
    }
  }

  @media (min-width: 960px) and (max-width: 1080px) {
    .shell { padding: 36px 40px 40px; }
    .layout {
      grid-template-columns: minmax(0, 1fr) minmax(380px, 0.95fr);
      gap: 40px;
    }
    h1 { font-size: clamp(48px, 4.8vw, 56px); }
    .panel { padding: 30px 28px 24px; }
    .kite-art { margin-top: 24px; }
  }

  @media (max-height: 720px) and (min-width: 960px) {
    .shell { padding-top: 28px; padding-bottom: 28px; }
    .layout { padding-top: 12px; padding-bottom: 8px; }
    h1 { font-size: clamp(46px, 4.3vw, 58px); }
    .kite-art { margin-top: 18px; max-height: 220px; }
    .panel { padding-top: 28px; padding-bottom: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <svg width="21" height="21" viewBox="0 0 22 22" aria-hidden="true">
          <path d="M11 1.6 19.4 10 11 18.4 2.6 10Z" fill="currentColor"/>
          <path d="M11 1.6V18.4M2.6 10H19.4" stroke="#F6F6F1" stroke-width="1.05" opacity="0.72"/>
        </svg>
        <span class="wordmark">Kite</span>
      </div>
      <p class="step">Step 2 of 3</p>
    </header>

    <div class="progress" role="progressbar" aria-label="Step 2 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2">
      <span class="done"></span>
      <span class="current"></span>
      <span></span>
    </div>

    <div class="layout">
      <section class="intro">
        <h1>Let's set up your view</h1>

        <svg class="kite-art" viewBox="0 0 560 300" role="img" aria-label="A kite drifting on a thin line">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#CFE2D6" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#CFE2D6" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse cx="366" cy="112" rx="198" ry="146" fill="url(#glow)"/>
          <path d="M-18 286C92 258 210 212 358 118" fill="none" stroke="#8AA395" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
          <path d="M358 164C352 190 374 202 360 226C350 244 364 254 356 270" fill="none" stroke="#8AA395" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
          <path d="M358 64 399 112 358 160 317 112Z" fill="#FCFCF9" fill-opacity="0.5" stroke="#5D7C6D" stroke-width="1.25" stroke-linejoin="round"/>
          <path d="M358 64V160M317 112H399" fill="none" stroke="#8AA395" stroke-width="0.95" opacity="0.75"/>
          <path d="M424 84H466M436 104H464M452 124H472" fill="none" stroke="#A9BDB2" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
        </svg>
      </section>

      <form class="panel" novalidate>
        <h2 class="question" id="track-question">What do you want to track?</h2>

        <div class="options" role="radiogroup" aria-labelledby="track-question">
          <label class="option is-selected">
            <input class="sr-only" type="radio" name="track" value="daily-spending" checked>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <rect x="2.9" y="5.4" width="14.2" height="9.9" rx="2.3" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2.9 8.4h14.2" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="13.9" cy="12.3" r="0.9" fill="currentColor"/>
              </svg>
            </span>
            <span class="option-label">Daily spending</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10.2"/>
                <path class="tick" d="M6.7 11.2l2.8 2.8 5.8-6"/>
              </svg>
            </span>
          </label>

          <label class="option">
            <input class="sr-only" type="radio" name="track" value="bills">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M5 2.9h10v13.4l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2V2.9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M7.5 6.6h5M7.5 9.5h5M7.5 12.4h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="option-label">Bills</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10.2"/>
                <path class="tick" d="M6.7 11.2l2.8 2.8 5.8-6"/>
              </svg>
            </span>
          </label>

          <label class="option">
            <input class="sr-only" type="radio" name="track" value="savings-goals">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="6.7" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="0.9" fill="currentColor"/>
              </svg>
            </span>
            <span class="option-label">Savings goals</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10.2"/>
                <path class="tick" d="M6.7 11.2l2.8 2.8 5.8-6"/>
              </svg>
            </span>
          </label>

          <label class="option">
            <input class="sr-only" type="radio" name="track" value="debt">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M10 3.4v12.8M6.6 16.2h6.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M3.4 6.4h13.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M3.4 6.4 1.8 9.8h3.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                <path d="M16.6 6.4l-1.6 3.4h3.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="option-label">Debt</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10.2"/>
                <path class="tick" d="M6.7 11.2l2.8 2.8 5.8-6"/>
              </svg>
            </span>
          </label>
        </div>

        <div class="actions">
          <p class="reassure" id="reassure">You can change this any time.</p>
          <button class="continue" type="button" aria-describedby="reassure">Continue</button>
          <button class="skip" type="button">Skip for now</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    (function () {
      var options = Array.prototype.slice.call(document.querySelectorAll('.option'));

      function sync() {
        options.forEach(function (option) {
          var input = option.querySelector('input');
          option.classList.toggle('is-selected', input.checked);
        });
      }

      options.forEach(function (option) {
        option.querySelector('input').addEventListener('change', sync);
      });

      sync();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1E9">
  <title>Kite — Let's set up your view</title>
  <style>
    :root {
      --canvas: #F3F1E9;
      --surface: #FBF9F3;
      --surface-soft: #F4F1E8;
      --ink: #18241E;
      --ink-soft: #506057;
      --muted: #5F6D64;
      --line: #DFDCD1;
      --line-strong: #CFCBBE;
      --accent: #20523F;
      --accent-deep: #163E2F;
      --accent-soft: #E9F1EA;
      --accent-line: #BED3C4;
      --gold: #C7A77B;
      --focus: rgba(32, 82, 63, .72);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(32, 82, 63, .12) .7px, transparent .7px);
      background-size: 20px 20px;
      opacity: .42;
      -webkit-mask-image: radial-gradient(48% 52% at 84% 20%, #000 0%, transparent 76%);
      mask-image: radial-gradient(48% 52% at 84% 20%, #000 0%, transparent 76%);
    }

    .glow {
      position: absolute;
      border-radius: 50%;
    }

    .glow-a {
      width: 78vmax;
      height: 78vmax;
      top: -39vmax;
      left: -31vmax;
      background: radial-gradient(circle, rgba(181, 205, 187, .55) 0%, rgba(181, 205, 187, 0) 66%);
    }

    .glow-b {
      width: 62vmax;
      height: 62vmax;
      right: -23vmax;
      bottom: -30vmax;
      background: radial-gradient(circle, rgba(222, 202, 167, .46) 0%, rgba(222, 202, 167, 0) 69%);
    }

    .glow-c {
      width: 44vmax;
      height: 44vmax;
      top: 36%;
      right: 6%;
      background: radial-gradient(circle, rgba(255, 252, 243, .8) 0%, rgba(255, 252, 243, 0) 67%);
    }

    .kite-art {
      position: absolute;
      display: none;
      color: #2E5B47;
    }

    .kite-art-one {
      width: clamp(250px, 24vw, 360px);
      height: auto;
      left: 4.5vw;
      top: 50%;
      opacity: .34;
      transform: translateY(-50%) rotate(-5deg);
    }

    .kite-art-two {
      width: clamp(150px, 12vw, 200px);
      height: auto;
      right: 7vw;
      top: 11%;
      opacity: .2;
      transform: rotate(9deg);
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      align-items: flex-start;
      justify-content: center;
      padding: 0 22px;
    }

    .panel {
      display: flex;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      padding: calc(22px + env(safe-area-inset-top)) 0 calc(22px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(32, 82, 63, .1);
      border-radius: 10px;
      background: linear-gradient(145deg, #EEF4ED, #E4EDE5);
      color: var(--accent);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset;
    }

    .brand-mark svg {
      display: block;
      width: 18px;
      height: 18px;
    }

    .step-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 560;
      letter-spacing: .005em;
      white-space: nowrap;
    }

    .step-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(32, 82, 63, .1);
    }

    .progress {
      display: flex;
      gap: 7px;
      margin-top: 19px;
    }

    .progress-seg {
      height: 4px;
      flex: 1;
      border-radius: 99px;
      background: rgba(32, 82, 63, .12);
    }

    .progress-seg.is-complete {
      background: #A7C2B1;
    }

    .progress-seg.is-current {
      background: var(--accent);
      box-shadow: 0 1px 3px rgba(32, 82, 63, .22);
    }

    .title {
      max-width: 9.2em;
      margin: clamp(30px, 5vh, 42px) 0 0;
      color: #14221B;
      font-size: clamp(2.2rem, 1.6rem + 2.2vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -.052em;
      line-height: 1.04;
      text-wrap: balance;
    }

    .onboarding-form {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin: clamp(25px, 4vh, 35px) 0 0;
    }

    .choice-group {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .question {
      padding: 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 560;
      letter-spacing: -.018em;
      line-height: 1.35;
    }

    .options {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 9px;
      margin-top: 14px;
    }

    .option {
      position: relative;
      display: flex;
      min-height: 60px;
      align-items: center;
      gap: 13px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, .62);
      cursor: pointer;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .option-input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      opacity: 0;
    }

    .option-icon {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border: 1px solid rgba(32, 82, 63, .07);
      border-radius: 12px;
      background: var(--surface-soft);
      color: #5B7064;
      transition:
        color 180ms ease,
        background-color 180ms ease,
        border-color 180ms ease;
    }

    .option-icon svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .option-text {
      min-width: 0;
      flex: 1;
      color: #27352D;
      font-size: 16px;
      font-weight: 540;
      letter-spacing: -.012em;
      line-height: 1.3;
    }

    .option-control {
      display: grid;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      place-items: center;
      border: 1.5px solid #C7C8BE;
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      color: #FFFDF7;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        transform 180ms ease;
    }

    .option-control svg {
      width: 12px;
      height: 12px;
      opacity: 0;
      transform: scale(.7);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    @media (hover: hover) {
      .option:hover {
        border-color: var(--line-strong);
        background: rgba(255, 253, 248, .96);
        transform: translateY(-1px);
      }

      .option:hover .option-icon {
        background: #F8F6EF;
      }
    }

    .option:active {
      transform: translateY(0) scale(.997);
    }

    .option:has(.option-input:focus-visible) {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .option.is-checked,
    .option:has(.option-input:checked) {
      border-color: var(--accent-line);
      background:
        linear-gradient(140deg, rgba(237, 245, 238, .98), rgba(246, 250, 246, .9));
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .9) inset,
        0 8px 20px -19px rgba(20, 64, 45, .62);
    }

    .option.is-checked .option-icon,
    .option:has(.option-input:checked) .option-icon {
      border-color: rgba(32, 82, 63, .1);
      background: rgba(255, 255, 255, .8);
      color: var(--accent-deep);
    }

    .option.is-checked .option-text,
    .option:has(.option-input:checked) .option-text {
      color: var(--accent-deep);
      font-weight: 590;
    }

    .option.is-checked .option-control,
    .option:has(.option-input:checked) .option-control {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 2px 5px rgba(24, 67, 50, .2);
    }

    .option.is-checked .option-control svg,
    .option:has(.option-input:checked) .option-control svg {
      opacity: 1;
      transform: scale(1);
    }

    .footer {
      margin-top: auto;
      padding-top: 24px;
    }

    .reassurance {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 450;
      letter-spacing: .005em;
      line-height: 1.4;
      text-align: center;
    }

    .reassurance svg {
      display: block;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      color: #7C9A87;
    }

    .button-continue {
      position: relative;
      display: flex;
      width: 100%;
      height: 56px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 1px solid #143C2C;
      border-radius: 17px;
      background: linear-gradient(180deg, #245B45 0%, #194534 100%);
      color: #FCFAF4;
      font-size: 16px;
      font-weight: 590;
      letter-spacing: -.01em;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .15) inset,
        0 13px 24px -14px rgba(20, 61, 45, .72);
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        filter 160ms ease,
        opacity 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button-continue svg {
      width: 16px;
      height: 16px;
      color: rgba(252, 250, 244, .74);
      transition: transform 180ms ease;
    }

    @media (hover: hover) {
      .button-continue:not(:disabled):hover {
        filter: brightness(1.06);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, .17) inset,
          0 16px 27px -14px rgba(20, 61, 45, .74);
        transform: translateY(-1px);
      }

      .button-continue:not(:disabled):hover svg {
        transform: translateX(3px);
      }
    }

    .button-continue:not(:disabled):active {
      transform: translateY(0) scale(.995);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .12) inset,
        0 7px 14px -12px rgba(20, 61, 45, .7);
    }

    .button-continue:focus-visible,
    .skip:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .button-continue:disabled {
      opacity: .38;
      cursor: not-allowed;
      box-shadow: none;
    }

    .skip {
      display: block;
      width: fit-content;
      margin: 13px auto 0;
      color: #5D6C63;
      font-size: 14px;
      font-weight: 540;
      letter-spacing: -.005em;
      line-height: 1.4;
      text-decoration: underline;
      text-decoration-color: rgba(32, 82, 63, .32);
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      transition: color 160ms ease, text-decoration-color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .skip:hover {
      color: var(--accent-deep);
      text-decoration-color: rgba(32, 82, 63, .62);
    }

    @media (min-width: 1100px) {
      .kite-art {
        display: block;
      }
    }

    @media (min-width: 720px) {
      .page {
        align-items: center;
        padding: 40px 32px;
      }

      .panel {
        max-width: 640px;
        min-height: 0;
        padding: 34px 46px 36px;
        border: 1px solid rgba(255, 255, 255, .72);
        border-radius: 32px;
        background: rgba(251, 249, 243, .82);
        box-shadow:
          0 35px 90px -48px rgba(27, 48, 37, .42),
          0 2px 8px rgba(27, 48, 37, .045),
          0 1px 0 rgba(255, 255, 255, .85) inset;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      .brand {
        font-size: 20px;
      }

      .brand-mark {
        width: 33px;
        height: 33px;
      }

      .step-label {
        font-size: 12.5px;
      }

      .title {
        margin-top: 32px;
      }

      .onboarding-form {
        margin-top: 32px;
      }

      .question {
        font-size: 19px;
      }

      .options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 15px;
      }

      .option {
        min-height: 64px;
        padding: 10px 16px;
      }

      .footer {
        padding-top: 28px;
      }

      .reassurance {
        font-size: 13.5px;
      }

      .button-continue {
        height: 57px;
      }
    }

    @media (min-width: 720px) and (max-height: 760px) {
      .page {
        padding-block: 24px;
      }

      .panel {
        padding-block: 28px;
      }

      .title {
        margin-top: 24px;
        font-size: 44px;
      }

      .onboarding-form {
        margin-top: 24px;
      }

      .footer {
        padding-top: 22px;
      }
    }

    @media (max-width: 719px) and (max-height: 710px) {
      .panel {
        padding-top: calc(16px + env(safe-area-inset-top));
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }

      .progress {
        margin-top: 15px;
      }

      .title {
        margin-top: 24px;
        font-size: 33px;
      }

      .onboarding-form {
        margin-top: 22px;
      }

      .options {
        gap: 8px;
        margin-top: 12px;
      }

      .option {
        min-height: 55px;
        padding-block: 7px;
      }

      .option-icon {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .footer {
        padding-top: 17px;
      }

      .reassurance {
        margin-bottom: 10px;
      }

      .button-continue {
        height: 52px;
      }

      .skip {
        margin-top: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="glow glow-c"></span>

    <svg class="kite-art kite-art-one" viewBox="0 0 480 620" fill="none">
      <g stroke="currentColor" stroke-width="1.15">
        <path d="M240 44 408 218 240 570 72 218Z" opacity=".52"/>
        <path d="M240 44v526M72 218h336" opacity=".32"/>
        <path d="M240 570c25 17 23 40 51 54 29 14 27 39 55 52" stroke-linecap="round" opacity=".62"/>
        <path d="m299 585-12 18 21 3-8 21" stroke-linecap="round" stroke-linejoin="round" opacity=".48"/>
        <path d="m350 641-13 18 21 4-8 20" stroke-linecap="round" stroke-linejoin="round" opacity=".42"/>
        <circle cx="240" cy="218" r="28" opacity=".36"/>
      </g>
    </svg>

    <svg class="kite-art kite-art-two" viewBox="0 0 260 330" fill="none">
      <g stroke="currentColor" stroke-width="1.1">
        <path d="M130 26 224 128 130 302 36 128Z" opacity=".68"/>
        <path d="M130 26v276M36 128h188" opacity=".42"/>
        <path d="M130 302c15 10 13 24 31 32 17 8 16 23 32 30" stroke-linecap="round" opacity=".6"/>
        <circle cx="130" cy="128" r="15" opacity=".45"/>
      </g>
    </svg>
  </div>

  <main class="page">
    <section class="panel" aria-labelledby="page-title">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2.6 21 11l-9 10.4L3 11l9-8.4Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/>
              <path d="M12 2.6v18.8M3 11h18" stroke="currentColor" stroke-width="1.45" opacity=".48"/>
            </svg>
          </span>
          <span>Kite</span>
        </div>
        <span class="step-label">Step 2 of 3</span>
      </header>

      <div class="progress" role="progressbar" aria-label="Step 2 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2">
        <span class="progress-seg is-complete" aria-hidden="true"></span>
        <span class="progress-seg is-current" aria-hidden="true"></span>
        <span class="progress-seg" aria-hidden="true"></span>
      </div>

      <h1 class="title" id="page-title">Let's set up your view</h1>

      <form class="onboarding-form" novalidate>
        <fieldset class="choice-group">
          <legend class="question">What do you want to track?</legend>

          <div class="options">
            <label class="option is-checked">
              <input class="option-input" type="checkbox" name="track" value="daily-spending" checked>
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.75" y="5.75" width="16.5" height="12.5" rx="2.4"/>
                  <path d="M3.75 9.5h16.5" opacity=".6"/>
                  <path d="M15.5 14.4h2.1"/>
                </svg>
              </span>
              <span class="option-text">Daily spending</span>
              <span class="option-control" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3.4 8.2 2.8 2.8 6.4-6.3"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="bills">
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6.5 3.75h11v16.5l-2.75-1.65L12 20.25l-2.75-1.65L6.5 20.25V3.75Z"/>
                  <path d="M9.5 8h5M9.5 11.5h5"/>
                </svg>
              </span>
              <span class="option-text">Bills</span>
              <span class="option-control" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3.4 8.2 2.8 2.8 6.4-6.3"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="savings-goals">
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <circle cx="12" cy="12" r="8.25"/>
                  <circle cx="12" cy="12" r="4.55"/>
                  <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <span class="option-text">Savings goals</span>
              <span class="option-control" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3.4 8.2 2.8 2.8 6.4-6.3"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="debt">
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m4 7.5 5.2 5.2 3.1-3.1L19 16.1"/>
                  <path d="M19 11.4v4.7h-4.7"/>
                </svg>
              </span>
              <span class="option-text">Debt</span>
              <span class="option-control" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3.4 8.2 2.8 2.8 6.4-6.3"/>
                </svg>
              </span>
            </label>
          </div>
        </fieldset>

        <footer class="footer">
          <p class="reassurance">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="6.3"/>
              <path d="m5.3 8.1 1.8 1.8 3.6-3.7"/>
            </svg>
            <span>You can change this any time.</span>
          </p>

          <button class="button-continue" type="submit">
            <span>Continue</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.75 8h10.5M9.3 4l4 4-4 4"/>
            </svg>
          </button>

          <a class="skip" href="#">Skip for now</a>
        </footer>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var inputs = Array.prototype.slice.call(document.querySelectorAll('.option-input'));
      var button = document.querySelector('.button-continue');
      var form = document.querySelector('.onboarding-form');
      var skip = document.querySelector('.skip');

      function syncOptions() {
        var selected = 0;

        inputs.forEach(function (input) {
          var option = input.closest('.option');
          option.classList.toggle('is-checked', input.checked);
          if (input.checked) selected += 1;
        });

        button.disabled = selected === 0;
      }

      inputs.forEach(function (input) {
        input.addEventListener('change', syncOptions);
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
      });

      skip.addEventListener('click', function (event) {
        event.preventDefault();
      });

      syncOptions();
    })();
  </script>
</body>
</html>

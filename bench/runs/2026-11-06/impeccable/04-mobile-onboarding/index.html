<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="color-scheme" content="light">
  <title>Kite — Let's set up your view</title>
  <style>
    :root {
      --paper: #f5f3ec;
      --ink: #18221c;
      --ink-soft: #3d4a41;
      --muted: #5f6b62;
      --line: #d9ddd3;
      --line-strong: #7d8b7c;
      --forest: #1b4a38;
      --forest-deep: #153b2d;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --ease: cubic-bezier(.2, .75, .3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    svg {
      display: block;
    }

    ::selection {
      background: #cfe2cf;
      color: var(--ink);
    }

    .stage {
      display: flex;
      min-height: 100svh;
      background: var(--paper);
    }

    /* ---------- Desktop atmosphere ---------- */

    .sky {
      display: none;
    }

    /* ---------- Form panel ---------- */

    .panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      min-height: 100svh;
      padding:
        max(18px, env(safe-area-inset-top))
        clamp(22px, 6vw, 40px)
        max(14px, env(safe-area-inset-bottom));
      overflow: hidden;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(24, 34, 28, .032) .55px, transparent .55px);
      background-size: 10px 10px;
      isolation: isolate;
    }

    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    .panel::before {
      top: -190px;
      right: -190px;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(158, 191, 158, .34) 0%, rgba(158, 191, 158, 0) 70%);
    }

    .panel::after {
      bottom: -210px;
      left: -190px;
      width: 430px;
      height: 430px;
      background: radial-gradient(circle, rgba(211, 177, 137, .2) 0%, rgba(211, 177, 137, 0) 72%);
    }

    .panel-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 468px;
      margin: 0 auto;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      gap: 16px;
    }

    .panel-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .brand-mark {
      --logo-a: #25523f;
      --logo-b: #6f9a80;
      width: 23px;
      height: 25px;
      flex: 0 0 auto;
    }

    .logo-facet-a {
      fill: var(--logo-a);
    }

    .logo-facet-b {
      fill: var(--logo-b);
    }

    .logo-tail {
      fill: none;
      stroke: var(--logo-b);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .wordmark {
      font-family: var(--display);
      font-size: 23px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.02em;
      color: var(--ink);
      padding-top: 1px;
    }

    .step-label {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .01em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .progress {
      display: flex;
      gap: 6px;
      height: 4px;
      margin-top: 15px;
    }

    .progress-seg {
      flex: 1;
      height: 100%;
      border-radius: 999px;
      background: #dfe2d8;
    }

    .progress-seg.is-done {
      background: #9bb3a0;
    }

    .progress-seg.is-current {
      background: var(--forest);
    }

    .flow {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .flow-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: clamp(30px, 6.5vh, 58px) 0 clamp(24px, 4.5vh, 42px);
    }

    .flow h1 {
      max-width: 9.5em;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(32px, 9.2vw, 46px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -.035em;
      color: var(--ink);
      text-wrap: balance;
    }

    .question-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-top: clamp(27px, 4.3vh, 38px);
    }

    .question-row h2 {
      margin: 0;
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -.012em;
      color: var(--ink);
    }

    .hint {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .option {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: clamp(112px, 16.5vh, 138px);
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .74) 0%, rgba(255, 255, 255, .38) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .82),
        0 1px 2px rgba(24, 34, 28, .025);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform .18s var(--ease),
        border-color .18s var(--ease),
        background-color .18s var(--ease),
        box-shadow .18s var(--ease);
    }

    .option:hover {
      border-color: #bfc7b9;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .94) 0%, rgba(255, 255, 255, .58) 100%);
      box-shadow:
        inset 0 1px 0 #fff,
        0 8px 18px -14px rgba(24, 60, 44, .38);
      transform: translateY(-1px);
    }

    .option:active {
      transform: scale(.987);
    }

    .option-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .option-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .option-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: rgba(31, 80, 58, .065);
      color: #2b5843;
      transition: background-color .18s var(--ease), color .18s var(--ease);
    }

    .option-icon svg {
      width: 20px;
      height: 20px;
    }

    .option-check {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      border: 1.5px solid var(--line-strong);
      border-radius: 50%;
      background: rgba(255, 255, 255, .76);
      color: #fff;
      transition:
        background-color .18s var(--ease),
        border-color .18s var(--ease);
    }

    .option-check svg {
      width: 11px;
      height: 9px;
      opacity: 0;
      transform: scale(.55);
      transition: opacity .16s var(--ease), transform .22s var(--ease);
    }

    .option-check path {
      stroke-dasharray: 16;
      stroke-dashoffset: 16;
      transition: stroke-dashoffset .22s var(--ease) .04s;
    }

    .option-label {
      margin-top: auto;
      padding-top: 22px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -.008em;
      color: var(--ink-soft);
      overflow-wrap: break-word;
    }

    .option:has(.option-input:checked),
    .option.is-selected {
      border-color: #6f9781;
      background:
        linear-gradient(180deg, #f1f6ec 0%, #e5efdf 100%);
      box-shadow:
        inset 0 0 0 1px var(--forest),
        inset 0 1px 0 rgba(255, 255, 255, .65),
        0 10px 22px -20px rgba(27, 74, 56, .55);
    }

    .option:has(.option-input:checked) .option-icon,
    .option.is-selected .option-icon {
      background: rgba(255, 255, 255, .7);
      color: var(--forest-deep);
    }

    .option:has(.option-input:checked) .option-check,
    .option.is-selected .option-check {
      border-color: var(--forest);
      background: var(--forest);
    }

    .option:has(.option-input:checked) .option-check svg,
    .option.is-selected .option-check svg {
      opacity: 1;
      transform: scale(1);
    }

    .option:has(.option-input:checked) .option-check path,
    .option.is-selected .option-check path {
      stroke-dashoffset: 0;
    }

    .option:has(.option-input:checked) .option-label,
    .option.is-selected .option-label {
      color: var(--forest-deep);
    }

    .option:has(.option-input:focus-visible) {
      outline: 3px solid #2d6a4c;
      outline-offset: 3px;
    }

    .flow-foot {
      position: relative;
      flex: 0 0 auto;
      padding-top: 19px;
    }

    .flow-foot::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(24, 34, 28, .13) 18%, rgba(24, 34, 28, .13) 82%, transparent);
    }

    .reassurance {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 0 13px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .reassurance svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      color: #4a6e58;
    }

    .primary {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 56px;
      padding: 0 22px;
      border: 0;
      border-radius: 15px;
      background: var(--forest);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.012em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .15),
        0 14px 28px -20px rgba(21, 59, 45, .7);
      transition:
        background-color .18s var(--ease),
        box-shadow .18s var(--ease),
        transform .18s var(--ease);
    }

    .primary:hover {
      background: var(--forest-deep);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        0 18px 30px -20px rgba(21, 59, 45, .75);
    }

    .primary:active {
      transform: translateY(0);
    }

    .primary:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 3px var(--paper),
        0 0 0 5.5px #3c7a5b,
        0 14px 28px -20px rgba(21, 59, 45, .7);
    }

    .primary svg {
      width: 18px;
      height: 18px;
      transition: transform .2s var(--ease);
    }

    .primary:hover svg {
      transform: translateX(2px);
    }

    .skip {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin: 5px auto 0;
      padding: 0 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      text-decoration-color: #aeb7ab;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .16s var(--ease), text-decoration-color .16s var(--ease);
    }

    .skip:hover,
    .skip:active {
      color: var(--forest);
      text-decoration-color: currentColor;
    }

    .skip:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px rgba(60, 122, 91, .65);
    }

    /* ---------- Desktop split ---------- */

    @media (min-width: 1000px) {
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(480px, 46vw, 700px);
      }

      .sky {
        position: relative;
        display: block;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(90% 75% at 18% 6%, rgba(130, 177, 146, .24) 0%, rgba(18, 51, 40, 0) 62%),
          radial-gradient(70% 60% at 92% 72%, rgba(196, 139, 93, .13) 0%, rgba(18, 51, 40, 0) 65%),
          linear-gradient(155deg, #193f32 0%, #123429 56%, #0d291f 100%);
        background-color: #123429;
      }

      .sky::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(rgba(232, 240, 227, .032) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 240, 227, .032) 1px, transparent 1px);
        background-size: 88px 88px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .7), transparent 70%);
        pointer-events: none;
      }

      .sky::after {
        content: "";
        position: absolute;
        left: -18%;
        bottom: -30%;
        width: 75%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(202, 149, 103, .12) 0%, rgba(202, 149, 103, 0) 68%);
        pointer-events: none;
      }

      .sky-brand {
        position: absolute;
        top: clamp(30px, 5vh, 52px);
        left: clamp(32px, 4.2vw, 68px);
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 11px;
      }

      .sky-brand .brand-mark {
        --logo-a: #edf3e7;
        --logo-b: #a6c4ae;
        width: 25px;
        height: 27px;
      }

      .sky-brand .wordmark {
        color: #f0f4ea;
        font-size: 27px;
        letter-spacing: -.018em;
      }

      .sky-svg {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
      }

      .kite-float {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: kite-drift 11s ease-in-out infinite alternate;
      }

      @keyframes kite-drift {
        from {
          transform: translateY(0) rotate(0deg);
        }
        to {
          transform: translateY(-9px) rotate(.45deg);
        }
      }

      .sky-watermark {
        position: absolute;
        right: clamp(22px, 3.4vw, 54px);
        bottom: clamp(-54px, -4vh, -24px);
        z-index: 1;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(190px, 24vw, 360px);
        font-weight: 400;
        line-height: .72;
        letter-spacing: -.1em;
        color: rgba(234, 241, 228, .055);
        font-variant-numeric: lining-nums tabular-nums;
        pointer-events: none;
        user-select: none;
      }

      .sky-watermark::before {
        content: "02";
      }

      .panel {
        min-height: 100svh;
        padding:
          clamp(30px, 4.2vh, 46px)
          clamp(36px, 4.6vw, 66px)
          clamp(24px, 3.4vh, 38px);
        border-left: 1px solid rgba(20, 52, 39, .06);
      }

      .panel::before {
        top: -150px;
        right: -210px;
        width: 520px;
        height: 520px;
      }

      .panel::after {
        bottom: -250px;
        left: -240px;
        width: 520px;
        height: 520px;
      }

      .panel-inner {
        max-width: 480px;
      }

      .panel-brand {
        display: none;
      }

      .panel-head {
        justify-content: flex-end;
      }

      .progress {
        margin-top: 17px;
      }

      .flow h1 {
        font-size: clamp(42px, 3.2vw, 50px);
        max-width: 9.4em;
      }

      .question-row {
        margin-top: clamp(30px, 4.3vh, 40px);
      }

      .options {
        gap: 11px;
      }

      .option {
        min-height: clamp(126px, 15.4vh, 148px);
        padding: 15px;
      }

      .option-label {
        padding-top: 26px;
        font-size: 15.5px;
      }

      .flow-foot {
        padding-top: 20px;
      }

      .reassurance {
        font-size: 13.5px;
      }

      .primary {
        height: 58px;
      }

      .skip {
        min-height: 46px;
      }
    }

    @media (min-width: 1000px) and (max-height: 780px) {
      .flow-body {
        padding-top: 22px;
        padding-bottom: 20px;
      }

      .flow h1 {
        font-size: 40px;
      }

      .question-row {
        margin-top: 24px;
      }

      .option {
        min-height: 116px;
      }

      .option-label {
        padding-top: 14px;
      }

      .sky-watermark {
        font-size: 250px;
      }
    }

    @media (max-height: 730px) {
      .panel {
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .panel-head {
        min-height: 28px;
      }

      .progress {
        margin-top: 11px;
      }

      .flow-body {
        padding-top: 22px;
        padding-bottom: 20px;
      }

      .flow h1 {
        font-size: clamp(29px, 8.6vw, 38px);
      }

      .question-row {
        margin-top: 23px;
      }

      .options {
        margin-top: 11px;
      }

      .option {
        min-height: 106px;
        padding: 12px;
        border-radius: 16px;
      }

      .option-label {
        padding-top: 12px;
        font-size: 14.5px;
      }

      .flow-foot {
        padding-top: 15px;
      }

      .reassurance {
        margin-bottom: 10px;
      }

      .primary {
        height: 52px;
      }

      .skip {
        min-height: 44px;
        margin-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <aside class="sky" aria-hidden="true">
      <div class="sky-brand">
        <svg class="brand-mark" viewBox="0 0 32 35" fill="none" aria-hidden="true">
          <path class="logo-facet-a" d="M16 2.2 28.6 14.2 16 28.2 3.4 14.2 16 2.2Z"/>
          <path class="logo-facet-b" d="M16 2.2 28.6 14.2 16 17.7 3.4 14.2 16 2.2Z"/>
          <path class="logo-tail" d="M16 28.2c2.1 2.2-.8 3.5.3 5.3"/>
        </svg>
        <span class="wordmark">Kite</span>
      </div>

      <svg class="sky-svg" viewBox="0 0 640 800" fill="none" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <radialGradient id="sun-glow" cx="34%" cy="30%" r="78%">
            <stop offset="0" stop-color="#e5b486"/>
            <stop offset=".55" stop-color="#c68b5d"/>
            <stop offset="1" stop-color="#9d6445"/>
          </radialGradient>
          <linearGradient id="kite-face" x1="350" y1="120" x2="424" y2="560" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ecf2e6" stop-opacity=".3"/>
            <stop offset=".58" stop-color="#ecf2e6" stop-opacity=".09"/>
            <stop offset="1" stop-color="#ecf2e6" stop-opacity=".025"/>
          </linearGradient>
        </defs>

        <circle cx="350" cy="360" r="218" fill="url(#sun-glow)" opacity=".42"/>
        <circle cx="350" cy="360" r="218" stroke="#f2d6b9" stroke-opacity=".18"/>
        <circle cx="350" cy="360" r="265" stroke="#f2d6b9" stroke-opacity=".055"/>

        <path d="M52 260c92-43 165-33 244-65" stroke="#e8f0e3" stroke-opacity=".15" stroke-linecap="round" stroke-dasharray="1 9"/>
        <path d="M77 612c112-47 234-28 525-111" stroke="#e8f0e3" stroke-opacity=".075" stroke-linecap="round"/>
        <path d="M93 659c125-43 257-24 445-78" stroke="#e8f0e3" stroke-opacity=".045" stroke-linecap="round"/>

        <g class="kite-float">
          <g transform="rotate(-8 350 350)">
            <path d="M350 114 488 352 350 570 212 352 350 114Z" fill="url(#kite-face)" stroke="#eaf1e4" stroke-opacity=".72" stroke-width="1.4"/>
            <path d="M350 114 350 570M212 352 488 352" stroke="#eaf1e4" stroke-opacity=".3" stroke-width="1"/>
            <path d="M350 114 488 352 350 570 350 352 350 114Z" fill="#0a251c" opacity=".055"/>
            <path d="M350 570c-27 40 37 59 8 101-24 35 34 63 10 114" stroke="#eaf1e4" stroke-opacity=".62" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M356 615c-16-10-35-5-37 7 14 9 32 5 41-5M360 704c-16-10-35-5-37 7 14 9 32 5 41-5" stroke="#eaf1e4" stroke-opacity=".38" stroke-width="1.1" stroke-linecap="round"/>
          </g>
        </g>
      </svg>

      <div class="sky-watermark"></div>
    </aside>

    <main class="panel">
      <div class="panel-inner">
        <header class="panel-head">
          <div class="panel-brand" aria-label="Kite">
            <svg class="brand-mark" viewBox="0 0 32 35" fill="none" aria-hidden="true">
              <path class="logo-facet-a" d="M16 2.2 28.6 14.2 16 28.2 3.4 14.2 16 2.2Z"/>
              <path class="logo-facet-b" d="M16 2.2 28.6 14.2 16 17.7 3.4 14.2 16 2.2Z"/>
              <path class="logo-tail" d="M16 28.2c2.1 2.2-.8 3.5.3 5.3"/>
            </svg>
            <span class="wordmark">Kite</span>
          </div>
          <span class="step-label">Step 2 of 3</span>
        </header>

        <div class="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-valuetext="Step 2 of 3">
          <span class="progress-seg is-done"></span>
          <span class="progress-seg is-current"></span>
          <span class="progress-seg"></span>
        </div>

        <form class="flow" id="setup-form" novalidate>
          <div class="flow-body">
            <h1>Let's set up your view</h1>

            <div class="question-row">
              <h2 id="tracking-question">What do you want to track?</h2>
              <span class="hint" id="choose-any">Choose any</span>
            </div>

            <div class="options" role="group" aria-labelledby="tracking-question" aria-describedby="choose-any">
              <label class="option">
                <input class="option-input" type="checkbox" name="tracking" value="daily-spending">
                <span class="option-top">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4.5 8.2h13.1a2 2 0 0 1 2 2v6.3a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V6.4a1.7 1.7 0 0 1 1.7-1.7h9.1"/>
                      <path d="M16 14.4h3.6"/>
                      <circle cx="17.8" cy="14.4" r=".65" fill="currentColor" stroke="none"/>
                    </svg>
                  </span>
                  <span class="option-check" aria-hidden="true">
                    <svg viewBox="0 0 12 9" fill="none">
                      <path d="m1 4.4 3.2 3L11 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </span>
                <span class="option-label">Daily spending</span>
              </label>

              <label class="option">
                <input class="option-input" type="checkbox" name="tracking" value="bills">
                <span class="option-top">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M6.3 3.8h11.4v15.6l-2.3-1.5-2.3 1.5-2.3-1.5-2.3 1.5-2.2-1.5V3.8Z"/>
                      <path d="M9 8h6M9 11.4h6M9 14.8h3.7"/>
                    </svg>
                  </span>
                  <span class="option-check" aria-hidden="true">
                    <svg viewBox="0 0 12 9" fill="none">
                      <path d="m1 4.4 3.2 3L11 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </span>
                <span class="option-label">Bills</span>
              </label>

              <label class="option">
                <input class="option-input" type="checkbox" name="tracking" value="savings-goals">
                <span class="option-top">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M6.2 21V4.3"/>
                      <path d="M6.2 4.9c2.8-1.8 5.7 1.3 8.6-.4 1.2-.7 2.1-.7 2.9-.5v7.4c-.8-.2-1.7-.2-2.9.5-2.9 1.7-5.8-1.4-8.6.4"/>
                    </svg>
                  </span>
                  <span class="option-check" aria-hidden="true">
                    <svg viewBox="0 0 12 9" fill="none">
                      <path d="m1 4.4 3.2 3L11 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </span>
                <span class="option-label">Savings goals</span>
              </label>

              <label class="option">
                <input class="option-input" type="checkbox" name="tracking" value="debt">
                <span class="option-top">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4.6 7.2h14.8M4.6 12h9.2M4.6 16.8h5.4"/>
                      <path d="M16.6 14.2v5.3M14 17l2.6 2.6L19.2 17"/>
                    </svg>
                  </span>
                  <span class="option-check" aria-hidden="true">
                    <svg viewBox="0 0 12 9" fill="none">
                      <path d="m1 4.4 3.2 3L11 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </span>
                <span class="option-label">Debt</span>
              </label>
            </div>
          </div>

          <footer class="flow-foot">
            <p class="reassurance">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-opacity=".42" stroke-width="1.2"/>
                <path d="m5.1 8.1 1.9 1.9 3.9-4.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              You can change this any time.
            </p>
            <button class="primary" type="submit">
              Continue
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M3.2 9h11.1M10.1 4.8 14.3 9l-4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="skip" type="button">Skip for now</button>
          </footer>
        </form>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const form = document.getElementById('setup-form');
      const options = Array.from(form.querySelectorAll('.option-input'));

      options.forEach((input) => {
        const option = input.closest('.option');
        const sync = () => option.classList.toggle('is-selected', input.checked);
        input.addEventListener('change', sync);
        sync();
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
      });
    })();
  </script>
</body>
</html>

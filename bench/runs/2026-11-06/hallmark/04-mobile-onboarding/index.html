<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f4">
<title>Kite — Let's set up your view</title>
<style>
:root {
  color-scheme: light;
  --paper: #fbf9f4;
  --canvas: #eeeadf;
  --card: #fffdf9;
  --ink: #1c231e;
  --muted: #62685f;
  --line: #e2ded3;
  --line-strong: #cbc6b9;
  --control-line: #7f857b;
  --accent: #245d4c;
  --accent-strong: #1b493b;
  --accent-quiet: #6f9688;
  --accent-soft: #e7efea;
  --on-accent: #f8fbf8;
  --focus: #1f5b49;
  --glow: rgba(36, 93, 76, 0.1);
  --clear: rgba(255, 255, 255, 0);
  --shadow-panel: 0 36px 80px -40px rgba(28, 35, 30, 0.38);
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --radius-panel: 1.75rem;
  --radius-option: 0.9375rem;
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  overflow-x: clip;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

svg {
  display: block;
}

::selection {
  background: var(--accent);
  color: var(--on-accent);
}

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(76rem 48rem at 82% -8%, var(--glow), var(--clear) 64%),
    var(--canvas);
  pointer-events: none;
}

.scene-kite {
  display: none;
  position: absolute;
  width: 20rem;
  height: auto;
  color: var(--accent);
  opacity: 0.14;
}

.kite-sail {
  fill: var(--accent-soft);
}

.panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.375rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
  background: var(--paper);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.brand-mark {
  width: 1.125rem;
  height: 1.375rem;
  color: var(--accent);
}

.brand-name {
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.step-count {
  margin: 0;
  font-size: 0.8125rem;
  line-height: 1.4;
  color: var(--muted);
}

.progress {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.375rem;
  margin-top: 0.9375rem;
}

.seg {
  height: 0.25rem;
  border-radius: 999px;
  background: var(--line-strong);
}

.seg-done {
  background: var(--accent-quiet);
}

.seg-current {
  background: var(--accent);
}

.content {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  padding-top: clamp(1.75rem, 5.5vh, 2.75rem);
}

.title {
  margin: 0;
  max-width: 13ch;
  min-width: 0;
  font-family: var(--font-serif);
  font-size: clamp(2.0625rem, 9vw, 2.5rem);
  font-weight: 400;
  line-height: 1.06;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-wrap: balance;
  overflow-wrap: break-word;
}

.flow {
  display: flex;
  flex-direction: column;
  flex: 1;
  margin-top: 1.375rem;
}

.fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.question {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.hint {
  margin: 0.25rem 0 0.875rem;
  font-size: 0.875rem;
  line-height: 1.45;
  color: var(--muted);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.875rem;
  min-height: 3.5rem;
  padding: 0.8125rem 0.9375rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-option);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition:
    background-color 0.16s var(--ease),
    border-color 0.16s var(--ease);
}

.option:has(.option-input:checked) {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.option:has(.option-input:focus-visible) {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.option-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  padding: 0;
  border: 0;
  opacity: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.option-name {
  flex: 1;
  min-width: 0;
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: -0.005em;
  color: var(--ink);
  overflow-wrap: break-word;
}

.check {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.375rem;
  height: 1.375rem;
  border: 1.5px solid var(--control-line);
  border-radius: 50%;
  color: var(--on-accent);
  transition:
    background-color 0.16s var(--ease),
    border-color 0.16s var(--ease);
}

.check svg {
  width: 0.75rem;
  height: 0.75rem;
  opacity: 0;
  transform: scale(0.6);
  transition:
    opacity 0.16s var(--ease),
    transform 0.16s var(--ease);
}

.option:has(.option-input:checked) .check {
  background: var(--accent);
  border-color: var(--accent);
}

.option:has(.option-input:checked) .check svg {
  opacity: 1;
  transform: scale(1);
}

.reassurance {
  margin: 0.75rem 0 0;
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0.25rem;
  margin-top: auto;
  padding-top: 1.5rem;
}

.primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 3.25rem;
  padding: 0.875rem 1.5rem;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font: inherit;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    background-color 0.16s var(--ease),
    transform 0.16s var(--ease);
}

.primary:active {
  transform: translateY(1px);
}

.primary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.skip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: center;
  min-height: 2.75rem;
  padding: 0.25rem 0.75rem;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.25em;
}

.skip:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  color: var(--ink);
}

@media (hover: hover) {
  .option:hover {
    border-color: var(--line-strong);
  }

  .option:has(.option-input:checked):hover {
    border-color: var(--accent-strong);
  }

  .primary:hover {
    background: var(--accent-strong);
  }

  .skip:hover {
    color: var(--ink);
  }
}

@media (min-width: 45rem) {
  .page {
    display: grid;
    place-items: center;
    padding: 2.5rem 1.5rem;
  }

  .panel {
    width: min(100%, 30rem);
    min-height: min(42.5rem, calc(100svh - 5rem));
    padding: 2rem;
    border: 1px solid var(--line);
    border-radius: var(--radius-panel);
    box-shadow: var(--shadow-panel);
  }

  .content {
    padding-top: 2.25rem;
  }

  .flow {
    margin-top: 1.25rem;
  }

  .actions {
    padding-top: 1.25rem;
  }

  .title {
    font-size: 2.375rem;
  }
}

@media (min-width: 72rem) {
  .scene-kite {
    display: block;
    left: max(1.5rem, calc(50% - 36rem));
    top: 50%;
    transform: translateY(-50%) rotate(-7deg);
  }
}

@media (max-height: 46rem) {
  .content {
    padding-top: 1.5rem;
  }

  .flow {
    margin-top: 1.25rem;
  }

  .options {
    gap: 0.375rem;
  }

  .option {
    min-height: 3.25rem;
    padding: 0.6875rem 0.9375rem;
  }

  .reassurance {
    margin-top: 0.625rem;
  }

  .actions {
    padding-top: 1.25rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .option,
  .check,
  .check svg,
  .primary {
    transition: none;
  }

  .primary:active {
    transform: none;
  }
}
</style>
</head>
<body>
<div class="page">
  <div class="scene" aria-hidden="true">
    <svg class="scene-kite" viewBox="0 0 28 36" fill="none" focusable="false">
      <path class="kite-sail" d="M14 1.75 25 13 14 27 3 13Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M14 1.75V27M3 13h22" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
      <path d="M14 27c4.4 3 .8 6.2-1.4 6.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      <path d="m13.8 30.2-2.4 1.4 1.1 2.1" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="panel">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 36" fill="none" aria-hidden="true" focusable="false">
          <path class="kite-sail" d="M14 1.75 25 13 14 27 3 13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M14 1.75V27M3 13h22" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
          <path d="M14 27c4.4 3 .8 6.2-1.4 6.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="m13.8 30.2-2.4 1.4 1.1 2.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Kite</span>
      </div>
      <p class="step-count">Step 2 of 3</p>
    </header>

    <div class="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-valuetext="Step 2 of 3">
      <span class="seg seg-done" aria-hidden="true"></span>
      <span class="seg seg-current" aria-hidden="true"></span>
      <span class="seg" aria-hidden="true"></span>
    </div>

    <main class="content">
      <h1 class="title">Let's set up your view</h1>

      <form class="flow" novalidate>
        <fieldset class="fieldset" aria-describedby="track-hint">
          <legend class="question">What do you want to track?</legend>
          <p class="hint" id="track-hint">Choose any that apply.</p>

          <div class="options">
            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="daily-spending">
              <span class="option-name">Daily spending</span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" focusable="false">
                  <path d="M2.2 6.3 4.7 8.8 9.8 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="bills">
              <span class="option-name">Bills</span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" focusable="false">
                  <path d="M2.2 6.3 4.7 8.8 9.8 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="savings-goals">
              <span class="option-name">Savings goals</span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" focusable="false">
                  <path d="M2.2 6.3 4.7 8.8 9.8 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>

            <label class="option">
              <input class="option-input" type="checkbox" name="track" value="debt">
              <span class="option-name">Debt</span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" focusable="false">
                  <path d="M2.2 6.3 4.7 8.8 9.8 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>
          </div>
        </fieldset>

        <p class="reassurance">You can change this any time.</p>

        <div class="actions">
          <button class="primary" type="button">Continue</button>
          <a class="skip" href="#">Skip for now</a>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>

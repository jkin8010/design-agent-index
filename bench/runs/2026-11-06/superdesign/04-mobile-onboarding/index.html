<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kite — Let's set up your view</title>
<style>
  :root {
    --paper: #fbf9f3;
    --paper-deep: #f3f0e6;
    --ink: #15251e;
    --ink-soft: #34463d;
    --muted: #5d6a62;
    --line: #dfdcd0;
    --line-strong: #cbc8ba;
    --forest: #173d2e;
    --forest-deep: #102f24;
    --forest-soft: #315d48;
    --lime: #dcef9b;
    --lime-soft: #eef6c9;
    --white: #fffdf8;
    --focus: #6d8a4c;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
    background: var(--paper-deep);
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    overflow-x: clip;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button,
  input {
    font: inherit;
  }

  a,
  button,
  label {
    -webkit-tap-highlight-color: transparent;
  }

  svg {
    display: block;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(70% 60% at 8% 0%, rgba(229, 240, 195, 0.92) 0%, rgba(229, 240, 195, 0) 64%),
      radial-gradient(48% 45% at 96% 96%, rgba(219, 232, 210, 0.8) 0%, rgba(219, 232, 210, 0) 72%),
      linear-gradient(145deg, #f0ede3 0%, #eae8dd 54%, #e6e7da 100%);
  }

  .ambient::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(21, 50, 37, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21, 50, 37, 0.045) 1px, transparent 1px);
    background-size: 76px 76px;
    -webkit-mask-image: radial-gradient(80% 70% at 50% 45%, #000 0%, transparent 78%);
    mask-image: radial-gradient(80% 70% at 50% 45%, #000 0%, transparent 78%);
    opacity: 0.5;
  }

  .ambient::after {
    content: "";
    position: absolute;
    top: -20vw;
    right: -12vw;
    width: 58vw;
    min-width: 520px;
    aspect-ratio: 1;
    border: 1px solid rgba(24, 61, 46, 0.09);
    border-radius: 50%;
    box-shadow:
      0 0 0 7vw rgba(255, 255, 255, 0.07),
      0 0 0 15vw rgba(255, 255, 255, 0.05);
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(0px, 4vw, 48px);
  }

  .shell {
    display: grid;
    grid-template-columns: 0.88fr 1.12fr;
    width: min(1180px, 100%);
    min-height: min(820px, calc(100vh - 96px));
    min-height: min(820px, calc(100svh - 96px));
    overflow: hidden;
    border: 1px solid rgba(21, 50, 37, 0.1);
    border-radius: 32px;
    background: var(--paper);
    box-shadow:
      0 50px 100px -48px rgba(14, 40, 28, 0.5),
      0 16px 40px -32px rgba(14, 40, 28, 0.34),
      0 1px 0 rgba(255, 255, 255, 0.72) inset;
  }

  .brand-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: clamp(32px, 3.4vw, 46px);
    overflow: hidden;
    color: #f8f6eb;
    background:
      radial-gradient(95% 72% at 18% 4%, rgba(82, 122, 88, 0.72) 0%, rgba(82, 122, 88, 0) 58%),
      radial-gradient(75% 58% at 92% 80%, rgba(42, 92, 69, 0.52) 0%, rgba(42, 92, 69, 0) 70%),
      linear-gradient(154deg, #1a4634 0%, #12392b 44%, #0d2b21 100%);
  }

  .brand-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(244, 248, 218, 0.32) 0.65px, transparent 0.65px);
    background-size: 12px 12px;
    opacity: 0.11;
  }

  .brand-top,
  .brand-bottom {
    position: relative;
    z-index: 2;
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--ink);
    font-size: 20px;
    font-weight: 640;
    letter-spacing: -0.035em;
    line-height: 1;
  }

  .wordmark svg {
    width: 21px;
    height: 23px;
  }

  .wordmark--light {
    color: #f9f7ed;
  }

  .wordmark--light svg {
    color: var(--lime);
  }

  .brand-art {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .brand-art svg {
    width: min(118%, 560px);
    height: auto;
    margin-top: 3%;
  }

  .brand-bottom {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    margin-top: auto;
  }

  .brand-rule {
    flex: 1;
    height: 1px;
    margin-bottom: 10px;
    background: rgba(245, 248, 224, 0.2);
  }

  .brand-step {
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: rgba(246, 247, 231, 0.58);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .brand-step-current {
    color: var(--lime);
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.06em;
    line-height: 0.78;
  }

  .brand-step-total {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.13em;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: clamp(30px, 3.9vw, 54px) clamp(28px, 4.3vw, 64px) clamp(28px, 3.3vw, 44px);
    background:
      radial-gradient(75% 60% at 100% 0%, rgba(239, 245, 219, 0.56) 0%, rgba(239, 245, 219, 0) 68%),
      linear-gradient(180deg, #fcfaf5 0%, #faf8f1 100%);
  }

  .mobile-brand-row {
    display: none;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 11px;
  }

  .progress-label {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.13em;
    line-height: 1;
    text-transform: uppercase;
  }

  .skip {
    position: relative;
    flex: none;
    padding: 4px 0;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.4;
    text-decoration: none;
    border-bottom: 1px solid rgba(93, 106, 98, 0.45);
    transition: color 180ms ease, border-color 180ms ease;
  }

  .skip:hover {
    color: var(--ink);
    border-color: var(--ink);
  }

  .skip:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .skip--mobile {
    display: none;
  }

  .progress {
    display: flex;
    gap: 5px;
    width: 100%;
    height: 4px;
  }

  .progress-seg {
    flex: 1;
    border-radius: 999px;
    background: #e4e0d4;
    transform-origin: left center;
  }

  .progress-seg.is-complete {
    background: var(--forest-soft);
  }

  .progress-seg.is-current {
    background: linear-gradient(90deg, var(--forest-soft) 0%, var(--forest-soft) 72%, #a7bf67 100%);
  }

  .panel-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  .title {
    margin: clamp(30px, 5.2vh, 52px) 0 0;
    color: var(--ink);
    font-size: clamp(2.85rem, 3.4vw + 1rem, 3.75rem);
    font-weight: 620;
    letter-spacing: -0.055em;
    line-height: 0.98;
  }

  .title span {
    display: block;
    white-space: nowrap;
  }

  .tracker-form {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    margin: 0;
  }

  .tracker-fieldset {
    min-inline-size: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .question {
    width: 100%;
    margin: clamp(26px, 4.2vh, 42px) 0 15px;
    padding: 0;
    color: var(--ink-soft);
    font-size: 16.5px;
    font-weight: 550;
    letter-spacing: -0.012em;
    line-height: 1.4;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .option {
    position: relative;
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 23px;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 12px 16px 12px 13px;
    border: 1px solid var(--line);
    border-radius: 17px;
    background: rgba(255, 253, 248, 0.72);
    color: var(--ink);
    cursor: pointer;
    box-shadow:
      0 1px 1px rgba(20, 44, 32, 0.025),
      0 1px 0 rgba(255, 255, 255, 0.9) inset;
    transition:
      transform 180ms ease,
      background-color 200ms ease,
      border-color 200ms ease,
      color 200ms ease,
      box-shadow 200ms ease;
  }

  .option:has(input:checked) {
    border-color: var(--forest);
    background: var(--forest);
    color: #fdfbf4;
    box-shadow:
      0 16px 26px -22px rgba(10, 37, 26, 0.9),
      0 1px 0 rgba(255, 255, 255, 0.08) inset;
  }

  .option:has(input:focus-visible) {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }

  @media (hover: hover) {
    .option:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: var(--white);
      box-shadow:
        0 10px 20px -18px rgba(20, 44, 32, 0.4),
        0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .option:has(input:checked):hover {
      border-color: #1c4937;
      background: #1b4635;
    }
  }

  .option:active {
    transform: translateY(0);
  }

  .option input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .option-icon {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #f0ede3;
    color: #3d594b;
    transition: background-color 200ms ease, color 200ms ease;
  }

  .option-icon svg {
    width: 20px;
    height: 20px;
  }

  .option:has(input:checked) .option-icon {
    background: rgba(246, 250, 225, 0.11);
    color: var(--lime);
  }

  .option-label {
    min-width: 0;
    font-size: 15.5px;
    font-weight: 550;
    letter-spacing: -0.012em;
    line-height: 1.3;
  }

  .option-check {
    position: relative;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1.4px solid #858778;
    border-radius: 50%;
    color: var(--forest-deep);
    transition: background-color 180ms ease, border-color 180ms ease;
  }

  .option-check::before {
    content: "";
    width: 8px;
    height: 4px;
    margin-top: -2px;
    border-bottom: 1.6px solid currentColor;
    border-left: 1.6px solid currentColor;
    opacity: 0;
    transform: rotate(-45deg) scale(0.6);
    transition: opacity 160ms ease, transform 180ms ease;
  }

  .option:has(input:checked) .option-check {
    border-color: var(--lime);
    background: var(--lime);
  }

  .option:has(input:checked) .option-check::before {
    opacity: 1;
    transform: rotate(-45deg) scale(1);
  }

  .option input:checked ~ .option-check {
    border-color: var(--lime);
    background: var(--lime);
  }

  .option input:checked ~ .option-check::before {
    opacity: 1;
    transform: rotate(-45deg) scale(1);
  }

  .option input:checked ~ .option-icon {
    background: rgba(246, 250, 225, 0.11);
    color: var(--lime);
  }

  .actions {
    margin-top: auto;
    padding-top: clamp(26px, 4.2vh, 46px);
  }

  .continue {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    width: 100%;
    min-height: 60px;
    padding: 8px 10px 8px 22px;
    border: 0;
    border-radius: 17px;
    background: var(--forest);
    color: #fcfaf2;
    cursor: pointer;
    box-shadow:
      0 16px 28px -22px rgba(10, 37, 26, 0.8),
      0 1px 0 rgba(255, 255, 255, 0.1) inset;
    transition: background-color 200ms ease, transform 180ms ease, box-shadow 200ms ease;
  }

  .continue-label {
    font-size: 16px;
    font-weight: 590;
    letter-spacing: -0.015em;
  }

  .continue-icon {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--lime);
    color: var(--forest-deep);
    transition: transform 200ms ease, background-color 200ms ease;
  }

  .continue-icon svg {
    width: 18px;
    height: 18px;
  }

  .continue:hover {
    background: #1d4737;
  }

  .continue:hover .continue-icon {
    transform: translateX(2px);
  }

  .continue:active {
    transform: translateY(1px);
  }

  .continue:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
  }

  .reassurance {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin: 13px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 430;
    line-height: 1.5;
    text-align: center;
  }

  .reassurance svg {
    flex: none;
    width: 14px;
    height: 14px;
    opacity: 0.8;
  }

  @media (max-width: 900px) {
    body {
      background:
        radial-gradient(80% 46% at 10% 0%, #eef3d8 0%, rgba(238, 243, 216, 0) 70%),
        linear-gradient(160deg, #f4f1e8 0%, #efede3 58%, #eae9df 100%);
    }

    .ambient {
      display: none;
    }

    .stage {
      display: block;
      min-height: 100vh;
      min-height: 100svh;
      padding: 0;
    }

    .shell {
      display: block;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .brand-panel {
      display: none;
    }

    .panel {
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(21px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(21px, env(safe-area-inset-left));
      background: transparent;
    }

    .mobile-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: clamp(28px, 5vh, 46px);
    }

    .skip--mobile {
      display: inline-block;
    }

    .skip--desktop {
      display: none;
    }

    .progress-row {
      margin-bottom: 10px;
    }

    .title {
      margin-top: clamp(26px, 4.8vh, 42px);
      font-size: clamp(2.35rem, 10.2vw, 3rem);
      line-height: 0.99;
    }

    .question {
      margin-top: clamp(24px, 4.2vh, 38px);
      margin-bottom: 13px;
      font-size: 16px;
    }

    .options {
      gap: 9px;
    }

    .option {
      grid-template-columns: 37px minmax(0, 1fr) 22px;
      gap: 13px;
      min-height: 61px;
      padding: 11px 15px 11px 12px;
      border-radius: 16px;
    }

    .option-icon {
      width: 37px;
      height: 37px;
      border-radius: 11px;
    }

    .option-label {
      font-size: 15.5px;
    }

    .actions {
      padding-top: clamp(24px, 4.4vh, 40px);
    }

    .continue {
      min-height: 57px;
    }

    .continue-icon {
      width: 40px;
      height: 40px;
    }
  }

  @media (max-width: 900px) and (max-height: 720px) {
    .mobile-brand-row {
      margin-bottom: 22px;
    }

    .title {
      margin-top: 24px;
      font-size: clamp(2.12rem, 9vw, 2.45rem);
    }

    .question {
      margin-top: 20px;
      margin-bottom: 11px;
    }

    .option {
      min-height: 55px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .actions {
      padding-top: 20px;
    }

    .reassurance {
      margin-top: 10px;
    }
  }

  @media (max-width: 360px) {
    .panel {
      padding-right: 18px;
      padding-left: 18px;
    }

    .title {
      font-size: 2.25rem;
    }

    .option {
      grid-template-columns: 34px minmax(0, 1fr) 21px;
      gap: 11px;
      padding-right: 12px;
      padding-left: 10px;
    }

    .option-icon {
      width: 34px;
      height: 34px;
    }

    .option-label {
      font-size: 15px;
    }
  }
</style>
</head>
<body>

  <main class="stage">
    <section class="shell" aria-label="Kite onboarding">
      <aside class="brand-panel" aria-label="Kite">
        <div class="brand-top">
          <span class="wordmark wordmark--light">
            <svg viewBox="0 0 24 26" fill="none" aria-hidden="true">

              </linearGradient>
            </defs>

            <circle cx="375" cy="187" r="252" fill="url(#glow)"/>
            <circle cx="375" cy="187" r="193" stroke="#eef6cc" stroke-opacity=".12"/>
            <circle cx="375" cy="187" r="135" stroke="#eef6cc" stroke-opacity=".08" stroke-dasharray="2 8"/>
            <path d="M375 18v-20M375 376v20M206 187h-20M564 187h-20" stroke="#eef6cc" stroke-opacity=".2"/>

            <g>
              <path d="M340 150 180 300 331 317Z" fill="url(#sailTop)"/>
              <path d="M340 150 471 304 331 317Z" fill="url(#sailRight)"/>
              <path d="M180 300 310 473 331 317Z" fill="url(#sailLeft)"/>
              <path d="M471 304 310 473 331 317Z" fill="url(#sailBottom)"/>
              <path d="M340 150 180 300 310 473 471 304Z" stroke="#f5f8dd" stroke-opacity=".58" stroke-width="1.35" stroke-linejoin="round"/>
              <path d="M340 150 331 317 310 473M180 300 331 317 471 304" stroke="#f5f8dd" stroke-opacity=".3" stroke-width="1.1"/>
              <circle cx="331" cy="317" r="3.2" fill="#f4ffc4"/>
              <circle cx="331" cy="317" r="10" stroke="#f4ffc4" stroke-opacity=".32"/>
            </g>

            <path d="M310 473c-18 49-47 94-33 163" stroke="#eef6cd" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
            <g opacity=".88">
              <path d="M300 513c12-7 22-4 25 8-11 7-21 4-25-8Z" fill="#d6e897"/>
              <path d="M281 563c12 3 18 11 15 22-12-2-18-11-15-22Z" fill="#c3d989"/>
              <path d="M280 615c-12 2-19 10-17 21 12-1 19-10 17-21Z" fill="#aec878"/>
            </g>

            <g stroke="#f1f7d6" stroke-opacity=".32">
              <path d="M78 119h33M78 119v33M480 572h-33M480 572v-33"/>
            </g>
            <g fill="#eff7d3" fill-opacity=".55">
              <circle cx="94" cy="341" r="1.7"/>
              <circle cx="463" cy="154" r="1.5"/>
              <circle cx="497" cy="241" r="1.2"/>

            </g>
            <path d="M433 391h28M447 377v28" stroke="#eff7d3" stroke-opacity=".22"/>
          </svg>
        </div>

        <div class="brand-bottom">
          <span class="brand-rule"></span>
          <span class="brand-step">
            <span class="brand-step-current">02</span>
            <span class="brand-step-total">/ 03</span>
          </span>
        </div>
      </aside>

      <section class="panel">
        <header class="panel-top">
          <div class="mobile-brand-row">
            <span class="wordmark">
              <svg viewBox="0 0 24 26" fill="none" aria-hidden="true">
                <path d="M12 1.7 22.1 10.4 12 24.3 1.9 10.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M1.9 10.4h20.2M12 1.7v22.6" stroke="currentColor" stroke-width="1.15" opacity=".62"/>
              </svg>
              Kite
            </span>
            <a class="skip skip--mobile" href="#">Skip for now</a>
          </div>

          <div class="progress-row">
            <span class="progress-label" id="progress-label">Step 2 of 3</span>
            <a class="skip skip--desktop" href="#">Skip for now</a>
          </div>
          <div class="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-valuetext="Step 2 of 3">
            <span class="progress-seg is-complete"></span>
            <span class="progress-seg is-current"></span>
            <span class="progress-seg"></span>
          </div>
        </header>

        <div class="panel-content">
          <h1 class="title"><span>Let's set up</span> <span>your view</span></h1>

          <form class="tracker-form">
            <fieldset class="tracker-fieldset">
              <legend class="question">What do you want to track?</legend>
              <div class="options">
                <label class="option">
                  <input type="checkbox" name="track" value="daily-spending" checked>
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.6"/>
                      <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="option-label">Daily spending</span>
                  <span class="option-check" aria-hidden="true"></span>
                </label>

                <label class="option">
                  <input type="checkbox" name="track" value="bills">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M6.8 3.4h7.1l3.3 3.3v13.9H6.8V3.4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M13.9 3.4v3.3h3.3M9.6 10.9h4.8M9.6 14.1h4.8M9.6 17.3h2.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="option-label">Bills</span>
                  <span class="option-check" aria-hidden="true"></span>
                </label>

                <label class="option">
                  <input type="checkbox" name="track" value="savings-goals">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6"/>
                      <circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="1.6"/>
                      <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
                    </svg>
                  </span>
                  <span class="option-label">Savings goals</span>
                  <span class="option-check" aria-hidden="true"></span>
                </label>

                <label class="option">
                  <input type="checkbox" name="track" value="debt">
                  <span class="option-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6"/>
                      <path d="M12 7.4v7.2M9.2 11.9 12 14.7l2.8-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="option-label">Debt</span>
                  <span class="option-check" aria-hidden="true"></span>
                </label>
              </div>
            </fieldset>

            <div class="actions">
              <button class="continue" type="button" aria-describedby="reassurance">
                <span class="continue-label">Continue</span>
                <span class="continue-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none">
                    <path d="M3.5 10h12.2M11 5.3l4.7 4.7-4.7 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              </button>
              <p class="reassurance" id="reassurance">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M15.9 7.2A6.3 6.3 0 1 0 16 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M16 3.6v3.9h-3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>You can change this any time.</span>
              </p>
            </div>
          </form>
        </div>
      </section>
    </section>
  </main>
</body>
</html>

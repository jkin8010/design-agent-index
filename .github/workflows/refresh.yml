name: refresh index

on:
  schedule:
    - cron: "17 1 * * 1"   # Mondays 01:17 UTC = 09:17 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild snapshot from live signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py --refresh

      - name: Commit if changed
        run: |
          git config user.name "design-agent-index-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git add README.md data/snapshots
          git commit -m "chore: weekly snapshot $(date -u +%Y-%m-%d)"
          git push
